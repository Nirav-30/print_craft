<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Print Craft</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>
    <header>
    <nav>
        <h1>Print Craft</h1>
        <a href="index.html">Home</a>
        <a href="index.html#products">Products</a>
        <a href="index.html#contact">Contact</a>
        <a href="cart.html">Cart 🛒</a>
    </nav>
</header>


    <main>
        <section class="hero">
            <h2>Design Your Own Clothes</h2>

            <p>
                Create custom T-shirts, hoodies and sweatshirts.
            </p>

            <button>
                Start Designing
            </button>

        </section>      


        <section class="products-section">
            <h2>Our Products</h2>
             <div id="products">
                <div class="product">
                    <img src="images/Sweatshirt.jpg" class="product-image">
                    <h2>Custom Sweatshirt</h2>
                    <p>Custom printed sweatshirt</p>

                    <h3>₹799.00</h3>

                    <button onclick="addToCart(3)">
                    Add to Cart
                    </button>
                </div>
                <div class="product">
                    <img src="images/hoddie.jpg" class="product-image">
                    <h2>Custom Hoodie</h2>
                    <p>Custom printed hoodie</p>

                    <h3>₹999.00</h3>

                    <button onclick="addToCart(2)">
                    Add to Cart
                    </button>
                </div>
                <div class="product">
                    <img src="images/tshirt.jpg" class="product-image">
                    <h2>Custom T-shirt</h2>
                    <p>Custom printed T-shirt</p>

                    <h3>₹499.00</h3>
                    <button onclick="addToCart(1)">
                    Add to Cart
                    </button>
                </div>
            </div>
        </section>


    </main>


    <script src="js/script.js"></script>

</body>

</html>
