<!DOCTYPE html>
<html>
    <head>
        <title>PrintCraft | Reset</title>
        <link rel="stylesheet" href="assets\css\style.css">
    </head>
    <body>
        <div class="login-card">
        <form action="Login.html" method="POST">
                   <h2>Reset Your Password</h2>
                   <div class="small">
                    Your new password should be different from previous password
                   </div>
                         
                    <label for="username">Username</label>
                    <input type="text" name="txtuser" id="username" Required>
                         
                    <label > New Password</label>
                    <input type="password" name="txtnpass" id="password" Required>

                     <label for="password"> Confirm Password</label>
                    <input type="password" name="txtcpass" id="password" Required>

                    <button type="submit" name="btnlogin">Reset Password</button>

        </form>
        </div>
    </body>
 </html>
